<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>qbit-monitor</title>
<link rel="icon" type="image/png" href="/static/icon.png" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">qb</span>
    <h1>qbit-monitor</h1>
  </div>
  <div class="header-right">
    <div id="instance-dots" class="instance-dots"></div>
    <button id="btn-refresh" class="btn ghost" title="Refresh now">&#8635;</button>
    <button id="btn-settings" class="btn ghost" title="Settings">&#9881;</button>
  </div>
</header>

<nav id="tabs" class="tabs"></nav>

<main id="view" class="view"></main>

<footer class="foot">
  <span id="foot-status"></span>
</footer>

<!-- Settings dialog -->
<dialog id="settingsDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>Settings</h2>
    <label>Poll interval (seconds)
      <input type="number" id="set-poll" min="5" step="5" />
    </label>
    <label>RSS scan interval (minutes)
      <input type="number" id="set-rss" min="1" step="1" />
    </label>
    <label>Default save folder (when a feed has no save path)
      <input type="text" id="set-data" placeholder="/data/torrents" />
    </label>
    <div class="dialog-actions">
      <button type="button" id="set-save" class="btn primary">Save</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Instance dialog -->
<dialog id="instanceDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>Instance</h2>
    <input type="hidden" id="inst-id" />
    <label>Name <input type="text" id="inst-name" placeholder="Instance 1" /></label>
    <label>URL <input type="text" id="inst-url" placeholder="http://192.168.0.15:8081" /></label>
    <label>Username <input type="text" id="inst-user" autocomplete="off" /></label>
    <label>Password <input type="password" id="inst-pass" autocomplete="new-password" /></label>
    <div id="inst-test-result" class="test-result"></div>
    <div class="dialog-actions">
      <button type="button" id="inst-test" class="btn ghost">Test</button>
      <button type="button" id="inst-save" class="btn primary">Save</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Feed dialog -->
<dialog id="feedDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>RSS feed</h2>
    <input type="hidden" id="feed-id" />
    <label>Name <input type="text" id="feed-name" placeholder="My private tracker" /></label>
    <label>Feed URL <input type="url" id="feed-url" placeholder="https://tracker/rss.php?passkey=..." /></label>
    <label>Download to instance
      <select id="feed-instance"></select>
    </label>
    <label>Save path (optional, overrides instance default)
      <input type="text" id="feed-savepath" placeholder="/downloads/tracker" />
    </label>
    <label>Category (optional, from instance)
      <input type="text" id="feed-category" list="feed-categories" placeholder="tracker" />
      <datalist id="feed-categories"></datalist>
    </label>
    <label>Tracker (slot / seed limits come from the tracker)
      <select id="feed-tracker"></select>
    </label>
    <label class="check"><input type="checkbox" id="feed-enabled" checked /> Enabled</label>
    <div class="dialog-actions">
      <button type="button" id="feed-save" class="btn primary">Save</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Tracker dialog -->
<dialog id="trackerDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>Tracker</h2>
    <input type="hidden" id="tracker-id" />
    <label>Name <input type="text" id="tracker-name" placeholder="e.g. BTN" /></label>
    <label>Max slots (optional, shared across all feeds of this tracker; defaults to 50)
      <input type="number" id="tracker-maxslots" min="1" placeholder="e.g. 200" />
    </label>
    <label>Seed hours before a slot frees (optional; defaults to 72.5)
      <input type="number" id="tracker-seedhours" min="1" step="0.5" placeholder="e.g. 72.5" />
    </label>
    <label class="check"><input type="checkbox" id="tracker-public" /> Public tracker (no slot or seed limits)</label>
    <div class="dialog-actions">
      <button type="button" id="tracker-save" class="btn primary">Save</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Add magnet dialog -->
<dialog id="addDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>Add magnet</h2>
    <label>Magnet links or .torrent URLs (one per line)
      <textarea id="add-urls" rows="3" placeholder="magnet:?xt=urn:btih:...&#10;https://tracker.example/file.torrent"></textarea>
    </label>
    <label>Download to instance
      <select id="add-instance"></select>
    </label>
    <label>Save path (optional)
      <input type="text" id="add-savepath" placeholder="/downloads/..." />
    </label>
    <label>Category (optional)
      <input type="text" id="add-category" list="add-categories" placeholder="tv" />
      <datalist id="add-categories"></datalist>
    </label>
    <label>Tracker (optional — private trackers count toward their slot cap)
      <select id="add-tracker"></select>
    </label>
    <div id="add-result" class="test-result"></div>
    <div class="dialog-actions">
      <button type="button" id="add-go" class="btn primary">Add</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Upload torrent file dialog -->
<dialog id="uploadDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>Add torrent</h2>
    <label>Torrent files (multi-select supported)
      <input type="file" id="upload-file" accept=".torrent,application/x-bittorrent" multiple required />
    </label>
    <label>Download to instance
      <select id="upload-instance"></select>
    </label>
    <label>Save path (optional)
      <input type="text" id="upload-savepath" placeholder="/downloads/..." />
    </label>
    <label>Category (optional)
      <input type="text" id="upload-category" list="upload-categories" placeholder="tv" />
      <datalist id="upload-categories"></datalist>
    </label>
    <label>Tracker (optional — private trackers count toward their slot cap)
      <select id="upload-tracker"></select>
    </label>
    <div id="upload-result" class="test-result"></div>
    <div class="dialog-actions">
      <button type="button" id="upload-go" class="btn primary">Add</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Move torrent dialog -->
<dialog id="moveDialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2>Move torrent</h2>
    <input type="hidden" id="move-hash" />
    <input type="hidden" id="move-from" />
    <p id="move-title" class="move-title"></p>
    <label>Destination instance
      <select id="move-to"></select>
    </label>
    <p class="move-note">Files stay on disk; the destination re-adds the torrent at the same save path and rechecks.</p>
    <div id="move-result" class="test-result"></div>
    <div class="dialog-actions">
      <button type="button" id="move-go" class="btn primary">Move</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
